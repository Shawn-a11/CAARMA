# # ECAPA-LARGE WAS USED 

model: "MFA-CONFORMER"
features: "Fbank"
augmentations: {
  add_noise: False,
  add_reverb: False,
  drop_freq: False,
  drop_chunk: False,
}
dataset: "/root/autodl-tmp/CAARMA/voxceleb_full.csv"
USE_WANDB: False;
criterion: 'AMSoftmaxGAN'
init_lr: 0.001
epochs: 30
weight_decay: 0.0000001
trial_path: "/root/autodl-tmp/voxcele1_dataset/voxceleb1_test_v2.txt"
root: "/root/autodl-tmp/voxcele1_dataset/test/wav/"
warmup_step: 2000
batch_size: 50
num_workers: 8
second: 3
do_augmentation: False
num_spk: 1211
mixup: True
embedding_dim: 192
checkpoint_path: "None"
resume_from_checkpoint: "None"  # full Lightning resume: optimizer/scheduler/epoch/global_step + synth table
save_dir: "/root/autodl-tmp/CAARMA/caarma_mfa_ckpts_boundary_utility_crp_persistent_synth_ddp"
title: "caarma_mfa"

# ── Persistent synthetic classes ──────────────────────────────────────────
# persistence: True  -> persistent synth-class table + learnable W_syn + memory
#                       bank (the method). False -> SLERP one-shot (matched OFF
#                       ablation: flip ONLY this flag to get the control run).
persistence: True
slerp_t: 0.5                 # SLERP interpolation coefficient (0.5 = midpoint)
synth_bank_size: 10          # per-speaker embedding memory-bank depth (XBM-style)
synth_max_factor: 4          # W_syn columns = synth_max_factor * num_spk
pair_strategy: "crp"         # "fixed_nn" = v1; "crp" = v2 create-vs-reuse sampling
crp_alpha: 1.0               # larger -> create new synthetic pairs more often
crp_topk: 4                  # new pairs are sampled from each anchor's top-k NN speakers
mixup_constraint: "gender"   # hard same-gender CRP candidate filtering
meta_csv: "/root/autodl-tmp/voxcele1_dataset/vox1_meta.csv"

# Boundary-informative persistent pseudo-speaker selection.
# Gender defines the valid candidate space; boundary utility decides which
# SLERP pseudo-speakers are worth creating/revisiting.
boundary_utility: True
boundary_candidate_pool: 64   # per-anchor same-gender cosine pre-pool for cheap scoring
boundary_tau_parent: 0.95     # reject pseudo-speakers collapsed into either parent
boundary_tau_low: 0.0         # reject out-of-manifold pseudo-speakers
boundary_tau_high: 0.90       # reject pseudo-speakers too close to a real non-parent
boundary_margin_gap: 0.05     # prefer ambiguous top1/top2 non-parent neighborhoods

# Capped/decayed CRP reuse and fixed synthetic budget.
synth_per_batch: 8            # batch_size=50 -> synthetic ratio about 0.16
crp_count_cap: 20.0           # prevent early mixture classes from dominating forever
crp_count_decay: 0.02         # epoch-level effective-count decay
crp_utility_kappa: 2.0        # stronger reuse for boundary-useful synthetic classes
utility_ema_beta: 0.9         # EMA of actual synthetic margin violation
discriminator_type: "spectral"   # "spectral" = 1-hidden MLP (professor: simple D); "mlp" = old 2-hidden
