# # ECAPA-LARGE WAS USED 

model: "MFA-CONFORMER"
features: "Fbank"
# SpecAugment on the mel-spectrogram (no external data, applied only during
# training). Standard SUPERB-style config: 2 freq masks (≤15 bins each) +
# 2 time masks (≤20 frames each).
spec_aug: False
freq_mask_param: 15
time_mask_param: 20
num_freq_masks: 2
num_time_masks: 2
augmentations: {
  add_noise: False,
  add_reverb: False,
  drop_freq: False,
  drop_chunk: False,
}
dataset: "/root/autodl-tmp/CAARMA/voxceleb_full.csv"
USE_WANDB: False;
criterion: 'AMSoftmaxGAN'
init_lr: 0.001
epochs: 30
weight_decay: 0.0000001
trial_path: "/root/autodl-tmp/voxcele1_dataset/voxceleb1_test_v2.txt"
root: "/root/autodl-tmp/voxcele1_dataset/test/wav/"
warmup_step: 2000
batch_size: 50
num_workers: 4
second: 3
do_augmentation: False
num_spk: 1211
mixup: True
embedding_dim: 192
checkpoint_path: "None"
resume_from_checkpoint: "None"
save_dir: "/root/autodl-tmp/CAARMA/caarma_mfa_ckpts_repro309_ddp"
title: "caarma_mfa"

# Seed for reproducibility — fed to pytorch_lightning.seed_everything
# (covers torch, numpy, Python random, and DataLoader workers).
seed: 42

# Autoresearch whitelist defaults. These values reproduce this branch's
# original hard-coded training behaviour; changing them defines a new trial.
am_margin: 0.2
am_scale: 30.0
discriminator_head_lr: 0.0002
discriminator_backbone_lr_factor: 0.01
lr_scheduler_step_size: 4
lr_scheduler_gamma: 0.5

# Source-faithful adversarial-weight controller. "fixed" bypasses the controller
# and always uses lambda_adv_fixed.
lambda_adv_mode: "source_dynamic"
lambda_adv_initial: 0.25
lambda_adv_fixed: 0.01
lambda_adv_reset_each_step: True
lambda_adv_ratio_low: 0.5
lambda_adv_ratio_high: 1.5
lambda_adv_floor: 0.0001
lambda_adv_cap: 0.01
lambda_adv_up_factor: 1.1
lambda_adv_down_factor: 0.9
