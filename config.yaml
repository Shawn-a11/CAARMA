model: "MFA-CONFORMER"
features: "Fbank"
augmentations: {
  add_noise: False,
  add_reverb: False,
  drop_freq: False,
  drop_chunk: False,
}
dataset: "/root/autodl-tmp/CAARMA/voxceleb_full.csv"
USE_WANDB: False;
criterion: 'AMSoftmaxGAN'
init_lr: 0.001
epochs: 30
weight_decay: 0.0000001
trial_path: "/root/autodl-tmp/voxcele1_dataset/voxceleb1_test_v2.txt"
root: "/root/autodl-tmp/voxcele1_dataset/test/wav/"
warmup_step: 2000
batch_size: 50
num_workers: 8
second: 3
do_augmentation: False
num_spk: 1211
mixup: True
embedding_dim: 192
checkpoint_path: "None"
save_dir: "/root/autodl-tmp/CAARMA/caarma_mfa_ckpts_mlpd_slerp_vmf_ddp"
title: "caarma_mfa"

# Mixup geometry: SLERP midpoint + vMF sampling around it.
# kappa controls tightness via mean-resultant-length A_d(kappa), NOT kappa itself.
# At d=192: 500 -> A~0.81 ~36 deg (recommended); 50 -> ~uniform (degenerate).
vmf_kappa: 500.0
