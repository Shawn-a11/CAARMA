model: "REDIMNET2-B6"
features: "Passthrough"
augmentations:
  add_noise: false
  add_reverb: false
  drop_freq: false
  drop_chunk: false

dataset: "${CAARMA_TRAIN_MANIFEST}"
trial_path: "${CAARMA_TRIAL_PATH}"
root: "${CAARMA_VOX1_EVAL_ROOT}"
save_dir: "${CAARMA_RUN_ROOT}/redimnet2_b6_caarma_resume_epoch5_to30/checkpoints"
redimnet2_checkpoint: "${CAARMA_REDIMNET2_CHECKPOINT}"
redimnet2_checkpoint_sha256: "bc45f032099f3c9f0fb6ad756bca23daeeba456d00c515056e388824ef36f41b"

USE_WANDB: false
criterion: "AMSoftmaxGAN"
init_lr: 0.001
encoder_lr: 0.00001
discriminator_lr: 0.0002
epochs: 30
weight_decay: 0.0000001
warmup_step: 2000
# ReDimNet2-B6 exceeds a V100-32 at 50 samples per rank. Two 25-sample
# micro-batches preserve the original effective global batch of 4*50=200.
batch_size: 25
manual_accumulate_grad_batches: 2
num_workers: 4
second: 3
do_augmentation: false
num_spk: "auto"
mixup: true
embedding_dim: 192
am_margin: 0.2
am_scale: 30
lambda_adv_init: 0.25
lambda_adv_floor: 0.0001
lambda_adv_cap: 0.01
checkpoint_path: "None"
save_top_k: 3
devices: 4
num_nodes: 1
precision: "16-mixed"
seed: 42

# Keep the proven full CAARMA method fixed while replacing only the encoder.
persistence: true
slerp_t: 0.5
synth_bank_size: 10
synth_max_factor: 4
pair_strategy: "crp"
crp_alpha: 1.0
crp_topk: 4
reuse_policy: "popularity"
reuse_power: 1.0
candidate_pool: "topk"
cluster_size: 8
synth_init: "slerp_parents"
discriminator_type: "projection"
title: "redimnet2_b6_caarma_resume_epoch5_to30"
