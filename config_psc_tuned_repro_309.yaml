model: "MFA-CONFORMER"
features: "Fbank"
augmentations:
  add_noise: false
  add_reverb: false
  drop_freq: false
  drop_chunk: false

dataset: "${CAARMA_TRAIN_MANIFEST}"
trial_path: "${CAARMA_TRIAL_PATH}"
root: "${CAARMA_VOX1_EVAL_ROOT}"
save_dir: "${CAARMA_RUN_ROOT}/tuned_repro_309_vox1/checkpoints"
hubert_cache_dir: "${CAARMA_HUBERT_CACHE}"
hubert_model_name: "facebook/hubert-large-ls960-ft"

USE_WANDB: false
criterion: "AMSoftmaxGAN"
init_lr: 0.001
discriminator_lr: 0.0002
epochs: 30
weight_decay: 0.00000001
warmup_step: 2000
lr_scheduler_step_size: 4
lr_scheduler_gamma: 0.5
batch_size: 50
num_workers: 4
second: 3
do_augmentation: false
num_spk: 1211
mixup: true
embedding_dim: 192
am_margin: 0.20
am_scale: 30
lambda_adv_mode: "fixed"
lambda_adv_fixed: 0.05
lambda_adv_initial: 0.25
lambda_adv_reset_each_step: false
joint_lsyn_scale: 1.0
checkpoint_path: "None"
save_top_k: 3
devices: 4
num_nodes: 1
precision: "16-mixed"
seed: 42
title: "tuned_repro_309_vox1_psc"
