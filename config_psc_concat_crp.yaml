model: "MFA-CONFORMER"
features: "Fbank"
augmentations:
  add_noise: false
  add_reverb: false
  drop_freq: false
  drop_chunk: false

dataset: "${CAARMA_TRAIN_MANIFEST}"
trial_path: "${CAARMA_TRIAL_PATH}"
root: "${CAARMA_VOX1_EVAL_ROOT}"
save_dir: "${CAARMA_RUN_ROOT}/concat_crp_persistent/checkpoints"

USE_WANDB: false
criterion: "AMSoftmaxGAN"
init_lr: 0.001
epochs: 30
weight_decay: 0.0000001
warmup_step: 2000
batch_size: 50
num_workers: 4
second: 3
do_augmentation: false
num_spk: 1211
mixup: true
embedding_dim: 192
checkpoint_path: "None"
resume_from_checkpoint: "None"
title: "concat_crp_persistent_psc"

persistence: true
slerp_t: 0.5
synth_bank_size: 10
synth_max_factor: 4
pair_strategy: "crp"
crp_alpha: 1.0
crp_topk: 4
discriminator_type: "concat"
