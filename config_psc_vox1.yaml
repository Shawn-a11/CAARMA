# Original CAARMA small-scale reproduction on VoxCeleb1.
# Training logic follows the public source state machine. Batch size and feature
# settings follow the paper. See docs/source_paper_discrepancies.md.
model: "MFA-CONFORMER"
features: "Fbank"
augmentations:
  add_noise: false
  add_reverb: false
  drop_freq: false
  drop_chunk: false

dataset: "${CAARMA_TRAIN_MANIFEST}"
trial_path: "${CAARMA_TRIAL_PATH}"
root: "${CAARMA_VOX1_EVAL_ROOT}"
save_dir: "${CAARMA_RUN_ROOT}/caarma_original_vox1/checkpoints"
hubert_cache_dir: "${CAARMA_HUBERT_CACHE}"
hubert_model_name: "facebook/hubert-large-ls960-ft"

USE_WANDB: false
criterion: "AMSoftmaxGAN"
init_lr: 0.001
epochs: 30
weight_decay: 0.0000001
warmup_step: 2000
batch_size: 50
num_workers: 4
second: 3
do_augmentation: false
num_spk: "auto"
mixup: true
embedding_dim: 192
am_margin: 0.2
am_scale: 26
checkpoint_path: "None"
save_top_k: 3
devices: 4
num_nodes: 1
precision: "16-mixed"
seed: 42
title: "caarma_original_vox1_psc"
